name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Bun (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/
      - run: bun run build
      - run: |
          if [ "$(head -c 19 dist/index.js)" != "#!/usr/bin/env node" ]; then
            echo "ERROR: dist/index.js missing shebang"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke:
    name: Smoke (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/index.js
      - run: npm install -g pnpm@9
      - name: Scaffold a project
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          node "$GITHUB_WORKSPACE/dist/index.js" smoke-app --yes --no-install
      - name: Install dependencies in scaffolded project
        run: |
          cd /tmp/smoke/smoke-app
          pnpm install
      - name: Typecheck scaffolded project
        run: |
          cd /tmp/smoke/smoke-app
          pnpm typecheck
